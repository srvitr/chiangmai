/* timeline */
.tl{margin-top:14px}
.st{display:grid;grid-template-columns:44px 40px minmax(0,1fr);column-gap:14px;padding:13px 0;border-top:1px solid var(--line);animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.st:last-child{border-bottom:1px solid var(--line)}
.st .t{font-family:var(--mono);font-size:13px;padding-top:2px}
.st .dot{position:relative;width:40px;height:40px;margin-top:-8px;transition:transform .3s}
.st .dot .ico{width:40px;height:40px;display:block;transition:filter .4s,opacity .4s}
.st .dot i{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:8px;background:var(--sage);border:2px solid var(--bg);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.st .dot i::after{content:"";position:absolute;left:4px;top:1.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.st.done .dot .ico{filter:grayscale(1);opacity:.45} .st.done .dot i{transform:scale(1)}
.st.done .ttl,.st.done .sub{opacity:.45}
.st.now .dot::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--lime);opacity:.35;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.15}} .st.now .t{color:var(--petrol)}
.st .hit{display:block;text-align:left;width:100%;min-width:0}
.fwrap{margin:10px 0 0;border-radius:20px;overflow:hidden;background:#F1EBE1;box-shadow:0 1px 0 rgba(43,26,23,.05)}
.fmap{display:block;width:100%;height:auto;aspect-ratio:1.05}
.fcomp{margin-top:12px;border-radius:18px}
.fcomp .fmap{aspect-ratio:var(--ar)}

.fmap .farea{font-family:var(--sans);font-weight:600;fill:#B9A99B;letter-spacing:.02em;pointer-events:none}
.fmap .fp,.fmap .fo{cursor:pointer}
.fmap text{font-family:var(--sans);pointer-events:none}
.fcardm{margin-top:10px;background:#fff;border-radius:18px;padding:12px 14px 6px}
.fct{display:grid;grid-template-columns:30px minmax(0,1fr) 32px;gap:10px;align-items:center}
.fct b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.fct span:not(.fn){display:block;font-size:13px;color:var(--muted)}
.fn{width:26px;height:26px;border-radius:13px;background:var(--petrol);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.fn.x{background:var(--mist);color:var(--muted)}
.fcx{width:32px;height:32px;border-radius:16px;background:#F1EAE1;color:var(--muted)}
.flist{margin-top:10px;display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;min-height:44px;border-top:1px solid var(--line);padding:4px 2px}
.frow:last-child{border-bottom:1px solid var(--line)}
.frow .fx{display:flex;flex-direction:column;min-width:0;padding:6px 0}
.frow .ft{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fnm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow.on{background:#F4EBE3}
.frow.on .fn{background:var(--lime);color:#2B1A17}
.mstyle{display:flex;justify-content:center;gap:4px;margin:10px 0 0 auto;background:#ECE3D7;border-radius:16px;padding:3px;width:max-content}
.mstyle button{min-height:30px;padding:0 14px;border-radius:13px;font-size:13px;font-weight:600;color:var(--muted)}
.mstyle button[aria-pressed="true"]{background:#fff;color:var(--ink)}

.st .t{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.ktag{display:inline-block;margin:5px 0 2px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:9px;background:#EFE6DB;color:var(--petrol)}
.ktag.k-soon{background:#F6ECD3;color:#8A6A1E}
.ktag.k-now,.ktag.k-late{background:#F8DCD6;color:#A3341F}
.st.past .t,.st.past .ttl,.st.past .sub,.st.past .ktag{opacity:.42}
.st.past .dot .ico{filter:grayscale(1);opacity:.42}
.dprog{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.dprog .bar{flex:1;height:4px;border-radius:2px;background:#E6DCCF;overflow:hidden}
.dprog .bar i{display:block;height:100%;background:var(--lime);border-radius:2px;transition:width .6s ease}
.dprog span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.fcard{margin:8px 0 4px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 rgba(43,26,23,.05)}
.fc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.fc-top a{color:var(--petrol);font-weight:600;min-height:32px;display:inline-flex;align-items:center}
.fc-row{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.fc-row div{display:flex;flex-direction:column}
.fc-row .fcr{align-items:flex-end}
.fc-row b{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.fc-row span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fc-row i{flex:1;height:0;border-top:2px dashed #DDD0C0;position:relative}
.fc-row i::after{content:"✈";position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-style:normal;font-size:14px;color:var(--petrol);background:#fff;padding:0 4px}
.fc-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.fc-foot b{color:var(--ink)}
.fc-chain{margin-top:6px;font-size:12px;font-weight:600;color:var(--petrol)}
.nnrow .fcard{margin-top:6px}
.herobox.trip{-webkit-mask-image:none;mask-image:none;padding-top:0;display:flex;flex-direction:column}
.herobox.trip .heroimg{order:2;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);mask-composite:intersect}
.tripcount{position:static;margin-top:10px}
.herobox.trip .heroimg{height:140px;width:100%;object-fit:cover;object-position:center 40%}
.herobox.trip .count{position:static;margin:0 0 6px max(24px,env(safe-area-inset-left,0px));animation:none}
.nnf{padding:0 10px 4px}
.nnf .fcard{margin:0;background:#FBF8F3;box-shadow:none}

.st .t{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.st .t .pill{display:inline-block;flex:none;height:auto;min-height:0;font-style:normal;font-family:var(--sans);font-size:11px;font-weight:600;line-height:13px;padding:3px 7px;border-radius:9px;white-space:nowrap}
.pnow{background:var(--lime);color:#2B1A17}
.pnext{background:#F0E2DF;color:var(--petrol)}
.st.stnext .dot::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px dashed rgba(122,30,44,.35)}
.st:not(.open) .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts .grab{background:#00B14F;color:#fff;padding:0 16px;border-radius:22px;min-height:40px;align-self:center}

.ttl{font-weight:500;transition:opacity .3s}
.sub{font-size:14px;color:var(--muted);transition:opacity .3s}
.open .ttl{font-size:20px;font-weight:600}
.more{overflow:hidden;animation:grow .35s ease both}
@keyframes grow{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.facts{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
.facts .bk{color:var(--petrol)}
.notes{margin-top:10px;font-size:14px;line-height:1.6}
.notes div{display:flex;gap:6px;color:var(--ink)} .notes .n{font-family:var(--serif);font-size:24px;line-height:1;color:var(--sage)}
.n.mo{color:var(--sage)} .n.pob{color:var(--petrol)}
.acts{display:flex;gap:20px;margin-top:6px;flex-wrap:wrap}
.acts a,.acts button{min-height:44px;display:inline-flex;align-items:center;font-size:14px;font-weight:500;color:var(--petrol)}
.acts .ok{color:var(--sage)}
textarea{width:100%;margin-top:8px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;background:var(--mist);color:var(--ink);padding:10px;min-height:70px;resize:vertical}
.st.stamp .dot{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
.it .ico{width:40px;height:40px;flex:none}
.it .mapbtn{width:34px;padding:0;justify-content:center}
.echips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1 * max(24px,env(safe-area-inset-left,0px))) 4px;padding:8px max(24px,env(safe-area-inset-left,0px));background:var(--bg)}
.echips::-webkit-scrollbar{display:none}
.echips button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
.echips button span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.echips button[aria-selected="true"]{background:#7A1E2C;border-color:#7A1E2C;color:#FFF8EF}
.echips button[aria-selected="true"] span{color:#F0CFCB}
.egrab{flex:none;height:34px;padding:0 14px;border-radius:17px;background:#00B14F;color:#fff;font-size:13px;font-weight:600}
.mapbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px 0 8px;border-radius:17px;border:1px solid var(--line);background:var(--mist);color:var(--petrol);font-size:13px;font-weight:600}
.mapbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mapbtn:active{background:var(--line)}
.it.done .ico{filter:grayscale(1);opacity:.5}
@keyframes stamp{0%{transform:scale(.4)}60%{transform:scale(1.7)}100%{transform:scale(1)}}

/* map */
.pano{margin:10px calc(-1 * max(24px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(24px,env(safe-area-inset-left,0px)));background:transparent;overflow-x:hidden;overflow-y:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pano::-webkit-scrollbar{display:none}
.pano{background:transparent;border-radius:0;}
.pano{position:relative;height:calc((100vw - 0px) * 600 / 1584 + 48px);max-height:211px;overflow:hidden;touch-action:pan-y;transition:height .6s cubic-bezier(.45,.05,.25,1),max-height .6s cubic-bezier(.45,.05,.25,1)}
@media (min-width:430px){.pano{height:211px}}
.pano.zoomed{height:min(calc(100vh - 200px),540px);max-height:540px;cursor:grab;touch-action:none}
.pano.zoomed.dragging{cursor:grabbing}
.pano.zoomed .mcard{touch-action:auto}
.mcard{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:3;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(43,26,23,.18);animation:sheet .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.mcard.out{animation:sheetOut .18s ease-in forwards;pointer-events:none}
@keyframes sheetOut{to{opacity:0;transform:translateY(16px)}}
.mtop{display:flex;align-items:center;gap:12px}
.mtop .num{width:30px;height:30px;border-radius:15px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.mtop .tx{flex:1;min-width:0} .mtop .tx b{display:block;font-weight:600;line-height:1.25} .mtop .tx span{font-size:13px;color:var(--muted)}
.mclose{width:36px;height:36px;border-radius:18px;background:var(--mist);color:var(--ink);font-size:14px;flex:none}
.md{margin:10px 0 0;font-size:14px;color:var(--ink)}
.mh{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.mact{display:flex;gap:8px;margin-top:12px}
.mstep{width:46px;height:44px;border-radius:14px;background:var(--mist);font-size:22px;color:var(--petrol);flex:none}
.mstep:disabled{opacity:.35}
.mgo{flex:1;height:44px;border-radius:14px;background:var(--petrol);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.zout{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;height:40px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.92);color:#2B1A17;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(43,26,23,.15);z-index:2}
.ztip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:#2B1A17;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:12px;pointer-events:none;white-space:nowrap}
.pwrap{position:absolute;left:0;top:0;width:1584px;height:600px;transform-origin:0 0;will-change:transform}
.pwrap img{display:block;width:1584px;height:600px;max-width:none}
.rp.hid{opacity:0}
.rp.popnow{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
.pwrap img.vh{position:absolute;left:0;top:0;max-width:none;display:block;pointer-events:none;transform-origin:50% 50%;will-change:transform,opacity;opacity:0}
.pwrap svg{position:absolute;inset:0;width:100%;height:100%}
.pwrap .route{stroke:#C9973A;stroke-width:7;filter:drop-shadow(0 2px 0 rgba(43,26,23,.45))}
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-7px)}}
.homepano{margin:34px calc(-1 * max(24px,env(safe-area-inset-left,0px))) 0;overflow:hidden;background:#ECE3D7;animation:rise .9s .6s both}
.homepano img{display:block;width:900px;max-width:none;height:auto;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(-900px + 100vw))}}
@media (min-width:480px){@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-420px)}}}
.route{fill:none;stroke:var(--petrol);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin{cursor:pointer}
.pin circle{transition:r .25s}

.card{margin-top:18px;display:flex;align-items:center;gap:14px;min-height:56px}
.card .num{width:28px;height:28px;border-radius:14px;background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.card .tx{flex:1;min-width:0}
.card .tx b{display:block;font-weight:600}
.card .tx span{font-size:13px;color:var(--muted)}
.hint{margin-top:18px;color:var(--muted);font-size:14px}
.steps{display:flex;gap:8px;margin-top:16px}
.mlist{margin-top:18px}
.ml{display:grid;grid-template-columns:28px 48px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;min-height:48px;border-top:1px solid var(--line);animation:rise .45s both;animation-delay:calc(300ms + var(--i) * 60ms)}
.ml:last-child{border-bottom:1px solid var(--line)}
.ml .mn{width:24px;height:24px;border-radius:12px;background:var(--petrol);color:var(--bg);font-size:12px;font-weight:600;display:grid;place-items:center}
.ml.on .mn{background:var(--lime);color:var(--on-lime)}
.ml .mt2{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ml .mx{overflow-wrap:anywhere}
.steps button{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);font-size:14px}

/* eats */
.prog{margin-top:14px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lime);border-radius:2px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.ftabs{display:flex;gap:22px;margin-top:22px}
.ft{min-height:44px;color:var(--muted);border-bottom:2px solid transparent;padding-bottom:4px}
.ft[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--lime)}
.grp{margin-top:22px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;border-top:1px solid var(--line);width:100%;text-align:left;animation:rise .45s both;animation-delay:calc(var(--i) * 30ms)}
.grp .it:last-child{border-bottom:1px solid var(--line)}
.it .tx{flex:1;min-width:0}
.it .nm{font-weight:500;overflow-wrap:anywhere}
.it .mt{font-size:13px;color:var(--muted)}
.it .mt a{color:var(--petrol)}
.it.done .nm{color:var(--muted)}

/* tab bar: floating deep-teal pill */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabbar nav{pointer-events:auto;max-width:330px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:rgba(255,253,249,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #E6DCCF;border-radius:30px;box-shadow:0 10px 30px rgba(43,26,23,.28)}
.tab{min-height:54px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:600;color:#5E4D45;transition:background .35s cubic-bezier(.3,1.4,.5,1),color .25s}
.tab img{width:30px;height:30px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-selected="true"]{background:#F3E2DF;color:#7A1E2C;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(122,30,44,.28)}
.tab[aria-selected="true"] img{transform:translateY(-3px) scale(1.15) rotate(-6deg);filter:none}
.tab.hop img{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.25) rotate(8deg)}100%{transform:translateY(-3px) scale(1.15) rotate(-6deg)}}
.toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#2B1A17;color:var(--bg);font-size:14px;padding:9px 16px;border-radius:20px;z-index:30;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:40;pointer-events:none;animation:cf .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),calc(var(--dy) + 60px)) rotate(var(--r));opacity:0}}
.tried{display:inline-block;margin-left:8px;padding:1px 7px;border:1.5px solid var(--sage);color:var(--sage);border-radius:6px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-6deg);vertical-align:2px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.lt{position:absolute;width:26px;height:26px;pointer-events:none;opacity:0;animation:lift 9s linear infinite}
.lt.l1{left:72%;animation-delay:1.5s} .lt.l2{left:84%;animation-delay:4.5s;width:20px;height:20px} .lt.l3{left:62%;animation-delay:7s;width:18px;height:18px}
@keyframes lift{0%{top:62%;opacity:0;transform:translateX(0) rotate(-4deg)}12%{opacity:.95}50%{transform:translateX(10px) rotate(4deg)}85%{opacity:.8}100%{top:4%;opacity:0;transform:translateX(-6px) rotate(-3deg)}}
.next,.dayrow{transition:transform .15s}
.next:active,.dayrow:active{transform:scale(.985)}

@keyframes fadein{from{opacity:0}to{opacity:1}}
.spr{position:absolute;pointer-events:none;will-change:transform,left,top}
.spr img{display:block;width:100%;height:auto}
/* Home: the red songthaew pulls away from the gate, past the couple, and off the island */
.truck{width:19%;left:62%;top:44%;opacity:0;animation:drive 11s 1.2s cubic-bezier(.45,.05,.4,1) infinite}
.truck img{transform:scaleX(-1)}
@keyframes drive{0%{left:51%;top:36%;opacity:0;transform:scale(.85)}8%{opacity:1}12%{left:53%;top:37.5%;transform:scale(.9)}
  45%{left:66%;top:45.5%;opacity:1;transform:scale(1)}55%{left:70%;top:48%;opacity:0;transform:scale(1.02)}100%{left:70%;top:48%;opacity:0}}
/* Plan: a little plane crosses each day's scene, its shadow sliding over the ground */
.plane{width:15%;left:100%;top:-6%;animation:fly 12s 0.8s linear infinite}

let thVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^th/i.test(v.lang));
  thVoice=vs.find(v=>/kanya|narisa|premwadee|female|หญิง/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs[0]||null; }catch(_){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.addEventListener?.("voiceschanged",pickVoice); }
function sayIt(text,btn){
  const S=window.speechSynthesis;
  if(!S||!window.SpeechSynthesisUtterance){ toast("This browser can't read aloud"); return; }
  document.querySelectorAll(".say.talk").forEach(b=>b.classList.remove("talk"));
  if(!thVoice) pickVoice();
  const u=new SpeechSynthesisUtterance(text); u.lang="th-TH"; if(thVoice) u.voice=thVoice;
  u.pitch=1.85; u.rate=.86; u.volume=1;   // high, slow and dramatic: the ตัวแม่ delivery
  window._utt=u;                         // keep a reference: iOS/Chrome can drop utterances that get garbage-collected
  let started=false;
  const done=()=>btn.classList.remove("talk");
  u.onstart=()=>{ started=true; btn.classList.add("talk"); };
  u.onend=done; u.onerror=e=>{ done(); if(e&&e.error&&e.error!=="interrupted"&&e.error!=="canceled") toast("Couldn't play the voice ("+e.error+")"); };
  btn.classList.add("talk");
  // Safari drops speak() called right after cancel(), so only cancel when something is actually playing
  if(S.speaking||S.pending){ S.cancel(); setTimeout(()=>S.speak(u),120); } else { S.resume&&S.resume(); S.speak(u); }
  setTimeout(()=>{ if(!started){ done(); toast(thVoice?"No sound? Turn off silent mode and raise the volume":"No Thai voice on this device"); } },2500);
  setTimeout(done,8000);
}

function dayTabs(){return `<div class="dtabs" role="tablist">${DAYS.map(d=>`<button class="dt" role="tab" data-day="${d.id}" aria-selected="${d.id===S.day}">${d.dw} ${d.dn}</button>`).join("")}</div>`}
function nowId(d){ const ti=tripInfo(); if(ti.phase!=="during"||DAYS[ti.idx]?.id!==d.id) return null;
  const n=new Date(NOWMS()+7*3600e3), m=n.getUTCHours()*60+n.getUTCMinutes(), LM=lateMap(d); let id=d.stops[0].id;
  d.stops.forEach(s=>{ if(tmin(LM[s.id]?LM[s.id].t:s.t)<=m) id=s.id }); return id; }
const nowMin=()=>{const n=new Date(NOWMS()+7*3600e3);return n.getUTCHours()*60+n.getUTCMinutes()};
const tmin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
/* ---------- smart layer: location, opening hours, running late, weather ---------- */
const BKK=()=>new Date(NOWMS()+7*3600e3);
const fmtM=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
/* location: only after the user taps "Use my location" once (remembered on this phone). ?at=lat,lng or window.__GEO for testing */
let GEO=null, geoWatch=null, geoT=0;
function geoNow(){ if(window.__GEO) return window.__GEO; try{const q=new URLSearchParams(location.search).get("at"); if(q){const [a,b]=q.split(",").map(Number); if(a&&b) return {la:a,lo:b};}}catch(_){} return GEO; }
function geoStart(ask){ if(!navigator.geolocation||geoWatch!=null) return;
  geoWatch=navigator.geolocation.watchPosition(p=>{ const first=!GEO; GEO={la:p.coords.latitude,lo:p.coords.longitude}; try{localStorage.setItem("mp-geo","1")}catch(_){}
    if(first||Date.now()-geoT>60e3){ geoT=Date.now(); refresh(); } },
    e=>{ if(geoWatch!=null) navigator.geolocation.clearWatch(geoWatch); geoWatch=null; if(ask) toast(e.code===1?"Location is blocked. Allow it for this site in Settings":"Couldn't get your location"); },
    {enableHighAccuracy:false,maximumAge:60e3,timeout:20e3}); }
function km(a,b){const r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 12742*Math.asin(Math.sqrt(h));}

function rushX(at){ const n=BKK(), wd=n.getUTCDay(), m=at??(n.getUTCHours()*60+n.getUTCMinutes()), wk=wd>=1&&wd<=5;
  if(wk&&m>=420&&m<570) return 1.3; if(wk&&m>=990&&m<1170) return 1.6; if((wd===5||wd===6)&&m>=1080&&m<1290) return 1.35; return 1; }

function geoTag(s,tStr){ const g=geoNow(); if(!g||!LL[s.p]) return ""; const arrive=tmin(tStr), nm=nowMin(); if(arrive-nm>180||arrive<nm) return "";

  const leave=arrive-tr.min-(tr.walk?0:5), diff=leave-nm, how=tr.walk?`${tr.min} min walk`:`${tr.min} min by Grab${tr.rush>1.2?" · rush hour":""}`;

document.addEventListener("touchend",()=>{ if(pr0==null) return; pr0=null; const el=$("#ptr"); if(!el) return;

  else { el.style.transition="opacity .2s, transform .25s"; el.style.opacity="0"; el.style.transform="translateY(-40px) scale(.6)"; } prD=0; },{passive:true});
async function pullRefresh(){ const el=$("#ptr"), t0=Date.now();

const IC={grab:'<svg viewBox="0 0 24 24"><path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16"/><path d="M4 16h16v3H4z"/><circle cx="8" cy="19" r="1.4"/><circle cx="16" cy="19" r="1.4"/></svg>',

function lpMenu(el){ let k, head, sub;
