<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}</style>
</head><body><title>Mo &amp; Pob in Chiang Mai</title>

<style>
/* Layout: one phone-width column (max 430px), a single view at a time, bottom tab bar. Minimal: white ground, hairlines, palette used sparingly. */
:root{
  --bg:#E3EAED; --ink:#04252F; --muted:#526770; --line:#CCD7DC; --mist:#D8E1E5;
  --petrol:#0C5070; --sage:#6A9168; --lime:#B5D22F; --on-lime:#04252F; --ring:#B9C4CB;
  --serif:"Instrument Serif",Georgia,serif; --sans:"Instrument Sans",system-ui,-apple-system,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--petrol);text-decoration:none}
:focus-visible{outline:2px solid var(--petrol);outline-offset:3px;border-radius:4px}
.app{max-width:430px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px calc(120px + env(safe-area-inset-bottom,0px))}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
h1{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:10px 0 0;text-wrap:balance}
h1 .serif{color:var(--petrol)}
.view{animation:viewIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* home */
.toprow{display:flex;justify-content:space-between}
.hhead{padding-top:4px}
.hhead .names{margin-top:6px}
.herobox{position:relative;margin:18px calc(-1 * max(24px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(24px,env(safe-area-inset-left,0px)));background:transparent;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
.heroimg{display:block;width:100%;height:auto;animation:fadein .8s .1s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px)}}
.count{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:16px;display:flex;align-items:baseline;gap:6px;color:#04252F;animation:rise .8s .7s both}
.count b{font-size:32px;font-weight:600;letter-spacing:-.02em}
.count span{font-size:14px;color:#3E5560}
.next{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:16px;animation:rise .7s .9s both}
.next .ico{width:52px;height:52px;flex:none}
.next .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.next b{font-size:17px;font-weight:600;margin-top:2px}
.next .sub{font-size:14px;color:var(--muted)}
.chev{font-size:26px;color:var(--muted);line-height:1}
.sh{display:flex;justify-content:space-between}
.todo{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--line)}
.todo:first-of-type{margin-top:8px}
.todo:last-child{border-bottom:1px solid var(--line)}
.todo .tx,.dayrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.todo .nm,.dayrow .nm{font-weight:500}
.todo .mt,.dayrow .mt{font-size:13px;color:var(--muted)}
.todo.done .ck{background:var(--sage);border-color:var(--sage)} .todo.done .ck svg{opacity:1;transform:none} .todo.done .nm{color:var(--muted);text-decoration:line-through}
.days4{margin-top:8px}
.dayrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:62px;border-top:1px solid var(--line)}
.dayrow:last-child{border-bottom:1px solid var(--line)}
.dd{width:40px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dd b{font-size:20px;font-weight:600} .dd span{font-size:11px;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}
.dc{font-size:13px;color:var(--muted)}

.names{font-family:var(--serif);font-style:italic;font-size:58px;line-height:1;color:var(--petrol);display:flex;gap:.22em;flex-wrap:wrap}
.names span{display:inline-block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.names span:nth-child(2){animation-delay:.12s;color:var(--sage)} .names span:nth-child(3){animation-delay:.24s}
.city{font-size:38px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin-top:6px;animation:rise .9s .38s cubic-bezier(.2,.7,.2,1) both}
.city i{display:inline-block;width:12px;height:12px;border-radius:6px;background:var(--lime);margin-left:6px;vertical-align:2px;animation:pop .5s 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.lede{margin:22px 0 0;color:var(--muted);max-width:290px;animation:rise .9s .5s both}
.lede b{color:var(--ink);font-weight:600}
.rows{margin-top:44px}
.r{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.r:last-child{border-bottom:1px solid var(--line)}
.r .v{color:var(--muted);text-align:right}
.cta{margin-top:28px;height:52px;border-radius:26px;background:var(--petrol);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:500;width:100%}
.sec{margin-top:36px}
.sec h2{font-size:20px;font-weight:600;margin:6px 0 8px}
.copy{color:var(--petrol);font-family:var(--mono);font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.tips li{margin:8px 0;color:var(--muted)} .tips{padding-left:18px;margin:0}
.who{display:flex;gap:10px;align-items:center;margin-top:10px}
.pill{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line)}
.pill[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:600}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px}
.sync i{width:6px;height:6px;border-radius:3px;background:var(--ring)} .sync i.on{background:var(--sage)}

/* day tabs */
.dayart{position:relative;margin:-28px calc(-1 * max(24px,env(safe-area-inset-right,0px))) 22px calc(-1 * max(24px,env(safe-area-inset-left,0px)));overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
.dayart img{display:block;width:100%;height:auto;animation:fadein .6s ease both}
.dtabs{display:flex;gap:24px;margin-top:22px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.dt{min-height:44px;padding-bottom:6px;color:var(--muted);border-bottom:2px solid transparent;transition:color .2s,border-color .3s}
.dt[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--lime)}
.dmeta{margin-top:14px;color:var(--muted);font-size:15px}

/* timeline */
.tl{margin-top:14px}
.st{display:grid;grid-template-columns:44px 40px minmax(0,1fr);column-gap:14px;padding:13px 0;border-top:1px solid var(--line);animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.st:last-child{border-bottom:1px solid var(--line)}
.st .t{font-family:var(--mono);font-size:13px;padding-top:2px}
.st .dot{position:relative;width:40px;height:40px;margin-top:-8px;transition:transform .3s}
.st .dot .ico{width:40px;height:40px;display:block;transition:filter .4s,opacity .4s}
.st .dot i{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:8px;background:var(--sage);border:2px solid var(--bg);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.st .dot i::after{content:"";position:absolute;left:4px;top:1.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.st.done .dot .ico{filter:grayscale(1);opacity:.45} .st.done .dot i{transform:scale(1)}
.st.done .ttl,.st.done .sub{opacity:.45}
.st.now .dot::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--lime);opacity:.35;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.15}} .st.now .t{color:var(--petrol)}
.st .hit{text-align:left;width:100%;min-width:0}
.ttl{font-weight:500;transition:opacity .3s}
.sub{font-size:14px;color:var(--muted);transition:opacity .3s}
.open .ttl{font-size:20px;font-weight:600}
.more{overflow:hidden;animation:grow .35s ease both}
@keyframes grow{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.facts{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
.facts .bk{color:var(--petrol)}
.notes{margin-top:10px;font-size:14px;line-height:1.6}
.notes div{display:flex;gap:6px;color:var(--ink)} .notes .n{font-family:var(--serif);font-size:24px;line-height:1;color:var(--sage)}
.n.mo{color:var(--sage)} .n.pob{color:var(--petrol)}
.acts{display:flex;gap:20px;margin-top:6px;flex-wrap:wrap}
.acts a,.acts button{min-height:44px;display:inline-flex;align-items:center;font-size:14px;font-weight:500;color:var(--petrol)}
.acts .ok{color:var(--sage)}
textarea{width:100%;margin-top:8px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;background:var(--mist);color:var(--ink);padding:10px;min-height:70px;resize:vertical}
.st.stamp .dot{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
.it .ico{width:40px;height:40px;flex:none}
.mapbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px 0 8px;border-radius:17px;border:1px solid var(--line);background:var(--mist);color:var(--petrol);font-size:13px;font-weight:600}
.mapbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mapbtn:active{background:var(--line)}
.it.done .ico{filter:grayscale(1);opacity:.5}
@keyframes stamp{0%{transform:scale(.4)}60%{transform:scale(1.7)}100%{transform:scale(1)}}

/* map */
.pano{margin:22px calc(-1 * max(24px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(24px,env(safe-area-inset-left,0px)));background:transparent;overflow-x:hidden;overflow-y:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pano::-webkit-scrollbar{display:none}
.pano{background:transparent;border-radius:0;}
.pano{position:relative;height:calc((100vw - 0px) * 600 / 1584 + 28px);max-height:191px;overflow:hidden;touch-action:pan-y;transition:height .6s cubic-bezier(.45,.05,.25,1),max-height .6s cubic-bezier(.45,.05,.25,1)}
@media (min-width:430px){.pano{height:191px}}
.pano.zoomed{height:min(calc(100vh - 200px),540px);max-height:540px;cursor:grab;touch-action:none}
.pano.zoomed.dragging{cursor:grabbing}
.pano.zoomed .mcard{touch-action:auto}
.mcard{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:3;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(4,37,47,.18);animation:sheet .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.mcard.out{animation:sheetOut .18s ease-in forwards;pointer-events:none}
@keyframes sheetOut{to{opacity:0;transform:translateY(16px)}}
.mtop{display:flex;align-items:center;gap:12px}
.mtop .num{width:30px;height:30px;border-radius:15px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.mtop .tx{flex:1;min-width:0} .mtop .tx b{display:block;font-weight:600;line-height:1.25} .mtop .tx span{font-size:13px;color:var(--muted)}
.mclose{width:36px;height:36px;border-radius:18px;background:var(--mist);color:var(--ink);font-size:14px;flex:none}
.md{margin:10px 0 0;font-size:14px;color:var(--ink)}
.mh{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.mact{display:flex;gap:8px;margin-top:12px}
.mstep{width:46px;height:44px;border-radius:14px;background:var(--mist);font-size:22px;color:var(--petrol);flex:none}
.mstep:disabled{opacity:.35}
.mgo{flex:1;height:44px;border-radius:14px;background:var(--petrol);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.zout{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;height:40px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.92);color:#04252F;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(4,37,47,.15);z-index:2}
.ztip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:#04252F;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:12px;pointer-events:none;white-space:nowrap}
.pwrap{position:absolute;left:0;top:0;width:1584px;height:600px;transform-origin:0 0;will-change:transform}
.pwrap img{display:block;width:1584px;height:600px;max-width:none}
.rp.hid{opacity:0}
.rp.popnow{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
.pwrap svg{position:absolute;inset:0;width:100%;height:100%}
.pwrap .route{stroke:#B5D22F;stroke-width:7;filter:drop-shadow(0 2px 0 rgba(4,37,47,.45))}
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-7px)}}
.homepano{margin:34px calc(-1 * max(24px,env(safe-area-inset-left,0px))) 0;overflow:hidden;background:#DAE5EB;animation:rise .9s .6s both}
.homepano img{display:block;width:900px;max-width:none;height:auto;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(-900px + 100vw))}}
@media (min-width:480px){@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-420px)}}}
.route{fill:none;stroke:var(--petrol);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin{cursor:pointer}
.pin circle{transition:r .25s}

.card{margin-top:18px;display:flex;align-items:center;gap:14px;min-height:56px}
.card .num{width:28px;height:28px;border-radius:14px;background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.card .tx{flex:1;min-width:0}
.card .tx b{display:block;font-weight:600}
.card .tx span{font-size:13px;color:var(--muted)}
.hint{margin-top:18px;color:var(--muted);font-size:14px}
.steps{display:flex;gap:8px;margin-top:16px}
.mlist{margin-top:18px}
.ml{display:grid;grid-template-columns:28px 48px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;min-height:48px;border-top:1px solid var(--line);animation:rise .45s both;animation-delay:calc(300ms + var(--i) * 60ms)}
.ml:last-child{border-bottom:1px solid var(--line)}
.ml .mn{width:24px;height:24px;border-radius:12px;background:var(--petrol);color:var(--bg);font-size:12px;font-weight:600;display:grid;place-items:center}
.ml.on .mn{background:var(--lime);color:var(--on-lime)}
.ml .mt2{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ml .mx{overflow-wrap:anywhere}
.steps button{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);font-size:14px}

/* eats */
.prog{margin-top:14px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lime);border-radius:2px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.ftabs{display:flex;gap:22px;margin-top:22px}
.ft{min-height:44px;color:var(--muted);border-bottom:2px solid transparent;padding-bottom:4px}
.ft[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--lime)}
.grp{margin-top:22px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;border-top:1px solid var(--line);width:100%;text-align:left;animation:rise .45s both;animation-delay:calc(var(--i) * 30ms)}
.grp .it:last-child{border-bottom:1px solid var(--line)}
.it .tx{flex:1;min-width:0}
.it .nm{font-weight:500;overflow-wrap:anywhere}
.it .mt{font-size:13px;color:var(--muted)}
.it .mt a{color:var(--petrol)}
.ck{width:26px;height:26px;border-radius:13px;border:1px solid var(--ring);flex:none;display:grid;place-items:center;transition:background .25s,border-color .25s}
.ck svg{width:12px;height:12px;stroke:#fff;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.it.done .ck{background:var(--sage);border-color:var(--sage)} .it.done .ck svg{opacity:1;transform:none}
.it.done .nm{color:var(--muted)}

/* tab bar: floating deep-teal pill */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabbar nav{pointer-events:auto;max-width:330px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:#04252F;border-radius:30px;box-shadow:0 10px 30px rgba(4,37,47,.28)}
.tab{min-height:54px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:500;color:#A9BEC6;transition:background .35s cubic-bezier(.3,1.4,.5,1),color .25s}
.tab img{width:30px;height:30px;transition:transform .35s cubic-bezier(.3,1.6,.5,1);filter:saturate(.75)}
.tab[aria-selected="true"]{background:#B5D22F;color:#04252F;font-weight:700}
.tab[aria-selected="true"] img{transform:translateY(-3px) scale(1.15) rotate(-6deg);filter:none}
.tab.hop img{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.25) rotate(8deg)}100%{transform:translateY(-3px) scale(1.15) rotate(-6deg)}}
.toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#04252F;color:var(--bg);font-size:14px;padding:9px 16px;border-radius:20px;z-index:30;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

function tripInfo(){
  const now=new Date(Date.now()+7*3600e3); const start=Date.UTC(2026,9,22), end=Date.UTC(2026,9,25,23,59);
  const today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  if(today<start) return {phase:"before",days:Math.round((start-today)/864e5)};
  if(now.getTime()<=end) return {phase:"during",idx:Math.round((today-start)/864e5)};
  return {phase:"after"};
}

  return `<div class="dayart"><img src="${d.id}.webp" alt="" width="1376" height="768">${CLOUD.replace(/CID/g,"c1")}${CLOUD.replace(/CID/g,"c2")}${CLOUD.replace(/CID/g,"c3")}${d.id==="d3"?`<img class="lt l1" src="ic/lantern.webp" alt=""><img class="lt l2" src="ic/lantern.webp" alt="">`:""}</div><span class="lab">Day ${i+1} · ${esc(d.base)}</span><h1>${splitTitle(d.title)}</h1>${dayTabs()}${sw}<p class="dmeta">${esc(d.sub)}</p><div class="tl">${stops}</div>`;
}
function routePts(d){const pts=[];d.stops.forEach(s=>{const xy=XY[s.p];if(xy&&(!pts.length||pts.at(-1).k!==s.p))pts.push({k:s.p,x:xy[0],y:xy[1],s})});return pts}
function smooth(pts){ if(pts.length<2) return ""; let p=`M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){const a=pts[i-1]||pts[i],b=pts[i],c=pts[i+1],e=pts[i+2]||c;
    p+=` C${(b.x+(c.x-a.x)/6).toFixed(1)} ${(b.y+(c.y-a.y)/6).toFixed(1)} ${(c.x-(e.x-b.x)/6).toFixed(1)} ${(c.y-(e.y-b.y)/6).toFixed(1)} ${c.x} ${c.y}`;} return p; }
function vMap(){
  const d=DAYS.find(x=>x.id===S.day), pts=routePts(d);
  const order={}, num={}; let nn=0; pts.forEach((p,i)=>{if(!(p.k in order)){order[p.k]=i+1;num[p.k]=++nn}});
  const others=Object.keys(XY).filter(k=>!(k in order)&&P[k]?.list);
  const K=S.zoomed?1:2.1;
  let svg=`<svg viewBox="0 0 1584 600" role="img" aria-label="Illustrated map of Chiang Mai with ${d.dw}'s route">`;
  others.forEach(k=>{const [x,y]=XY[k];svg+=`<g class="pin" data-pin="${k}" role="button" tabindex="0" aria-label="${esc(P[k].n)}"><circle cx="${x}" cy="${y}" r="${7*K}" fill="#FFFFFF" stroke="#04252F" stroke-opacity=".35" stroke-width="${2*K}"/><circle cx="${x}" cy="${y}" r="${22*K}" fill="transparent"/></g>`});
  svg+=`<path id="route" class="route" style="stroke-width:${S.zoomed?7:12}px" d="${smooth(pts)}"/>`;
  pts.forEach((p,i)=>{ if(order[p.k]!==i+1) return; const sel=S.sel===p.k, done=isDone(p.k);
    svg+=`<g class="pin rp" data-i="${i}" data-pin="${p.k}" role="button" tabindex="0" aria-label="${num[p.k]}. ${esc(P[p.k]?.n||p.s.title)}">
      <g class="${sel?"bob":""}"><ellipse cx="${p.x}" cy="${p.y+6*K}" rx="${15*K}" ry="${5*K}" fill="#04252F" opacity=".25"/><circle cx="${p.x}" cy="${p.y-7*K}" r="${(sel?22:17)*K}" fill="${sel?"#B5D22F":done?"#6A9168":"#0C5070"}" stroke="#FFFFFF" stroke-width="${3.5*K}"/>
      <text x="${p.x}" y="${p.y-1.5*K}" text-anchor="middle" font-size="${(sel?20:17)*K}" font-weight="600" font-family="Instrument Sans, sans-serif" fill="${sel?"#04252F":"#FFFFFF"}">${num[p.k]}</text></g>
      <circle cx="${p.x}" cy="${p.y-7*K}" r="${30*K}" fill="transparent"/></g>`; });
  svg+=`</svg>`;
  let card=`<p class="hint">Tap a number to see the stop. White dots are other places from Pob's list.</p>`;
  let mcard="";
  if(S.sel&&P[S.sel]){ const k=S.sel, n=num[k], st=d.stops.find(s=>s.p===k), p=P[k], seq=Object.keys(num), at=seq.indexOf(k);
    const prev=at>0?seq[at-1]:null, next=at>=0&&at<seq.length-1?seq[at+1]:null;
    mcard=`<div class="mcard" role="dialog" aria-label="${esc(p.n)}">
      <div class="mtop"><span class="num" style="${n?"":"background:var(--mist);color:var(--muted)"}">${n||"·"}</span>
        <div class="tx"><b>${esc(p.n)}</b><span>${st?st.t+" · ":"Not on today's route · "}${esc(p.c)}</span></div>
        <button class="mclose" data-zout="1" aria-label="Back to the whole map">✕</button></div>
      ${st?`<p class="md">${esc(st.d)}</p>`:""}${p.h?`<div class="mh">${esc(p.h)}</div>`:""}
      <div class="mact"><button class="mstep" data-pin="${prev||""}" ${prev?"":"disabled"} aria-label="Previous stop">‹</button>
        <a class="mgo" href="${mapsUrl(k)}" target="_blank" rel="noopener">Directions</a>
        <button class="mstep" data-pin="${next||""}" ${next?"":"disabled"} aria-label="Next stop">›</button></div></div>`;
    card=""; }

  return `<div class="pano ${S.zoomed?"zoomed":""}" id="pano" data-panobg="1"><div class="pwrap" id="pwrap"><img src="pano.webp" alt="" width="1584" height="600">${svg}</div>${mcard}</div>${card}`;
}
function vEats(){
  const AREA={watket:"Near K Maison · Wat Ket",bazaar:"Night Bazaar",oldcity:"Old City",nimman:"Nimman",suthep:"Suthep · Wat Umong",chotana:"Chang Phueak",wualai:"Wualai",maerim:"Mae Rim · near Raya",sankamphaeng:"Worth the drive"};
  const keys=Object.keys(P).filter(k=>P[k].list&&!scheduled[k]);
  const grp={}; keys.forEach(k=>{const g=AREA[P[k].a]||"Find on Maps";(grp[g]=grp[g]||[]).push(k)});
  const order=[...Object.values(AREA),"Find on Maps"]; let n=0;
  const html=order.filter(g=>grp[g]).map(g=>`<div class="grp"><span class="lab">${esc(g)}</span><div style="margin-top:8px">${grp[g].map(k=>{const p=P[k];return `<div class="it" style="--i:${n++}">${ico(iconFor(k,"eat"))}<div class="tx"><div class="nm">${esc(p.n)}</div><div class="mt">${esc(p.c)}${p.r?" · ★ "+p.r:""}${p.uv?" · check hours":""}</div></div><a class="mapbtn" href="${mapsUrl(k)}" target="_blank" rel="noopener" aria-label="Open ${esc(p.n)} in Google Maps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Map</a></div>`}).join("")}</div></div>`).join("");
  return `<h1>More to <span class="serif">eat</span></h1><p class="dmeta">${keys.length} places from Pob's list that aren't in the plan, by area. For when you're hungry nearby.</p>${html}`;
}

/* ---------- render ---------- */
/* ---------- map camera ---------- */
let cam=null, flyTok=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function frameH(){const p=$("#pano"); if(!p) return 0; const cw=p.clientWidth; return S.zoomed?Math.min((inDevice()?852:innerHeight)-200,540):Math.min(cw*600/1584,163)+28}
function zIn(){return frameH()/600*1.1}
function camTo(x,y,z,ms){
  const p=$("#pano"), w=$("#pwrap"); if(!p||!w) return; const cw=p.clientWidth, ch=frameH(), s=Math.max(z,cw/1584);
  let tx=cw/2-x*s, ty=ch*(S.zoomed&&S.sel?0.3:0.5)-y*s; const W=1584*s, H=600*s;
  tx=W>cw?Math.min(0,Math.max(cw-W,tx)):(cw-W)/2; ty=H>ch?Math.min(0,Math.max(ch-H,ty)):(ch-H)/2;
  w.style.transition=ms&&!reduce?`transform ${ms}ms cubic-bezier(.45,.05,.25,1)`:"none";
  w.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
  const f=S.zoomed&&S.sel?0.3:0.5; cam={x:(cw/2-tx)/s, y:(ch*f-ty)/s, z};
}
/* drag to move the map while zoomed in */
let drag=null, dragMoved=false;
document.addEventListener("pointerdown",e=>{ const p=e.target.closest("#pano"); if(!p||!S.zoomed||!cam||e.target.closest(".mcard")) return;
  drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,cx:cam.x,cy:cam.y,s:Math.max(cam.z,p.clientWidth/1584)}; dragMoved=false; flyTok++; });
document.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!dragMoved&&Math.hypot(dx,dy)<6) return; if(!dragMoved){ dragMoved=true; $("#pano")?.classList.add("dragging"); }
  camTo(drag.cx-dx/drag.s, drag.cy-dy/drag.s, cam.z, 0); e.preventDefault(); },{passive:false});
const endDrag=e=>{ if(!drag||(e&&e.pointerId!==drag.id)) return; drag=null; $("#pano")?.classList.remove("dragging"); if(dragMoved) setTimeout(()=>dragMoved=false,50); };
document.addEventListener("pointerup",endDrag); document.addEventListener("dragstart",e=>{ if(e.target.closest("img,#pano")) e.preventDefault(); }); document.addEventListener("selectstart",e=>{ if(drag) e.preventDefault(); }); document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{ if(dragMoved&&e.target.closest("#pano")){ e.stopPropagation(); e.preventDefault(); } },true);
const overview=ms=>camTo(792,300,0,ms);
function routeBox(pts){const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);return {x:(Math.min(...xs)+Math.max(...xs))/2,y:(Math.min(...ys)+Math.max(...ys))/2}}
function vertexLens(r,pts){const L=r.getTotalLength(),out=[];let l=0;
  pts.forEach((p,i)=>{ if(i===0){out.push(0);return} let best=l,bd=1e9; for(let t=l;t<=L;t+=5){const q=r.getPointAtLength(t),dd=(q.x-p.x)**2+(q.y-p.y)**2; if(dd<bd){bd=dd;best=t} if(bd<9&&dd>bd+400)break} l=best; out.push(best)}); return out}
async function drawRoute(animate){
  const r=document.getElementById("route"); if(!r) return; const my=++flyTok;
  const pts=routePts(DAYS.find(x=>x.id===S.day)), L=r.getTotalLength(), pins=[...document.querySelectorAll(".rp")];
  r.style.strokeDasharray=L;
  if(S.zoomed&&cam) camTo(cam.x,cam.y,cam.z,0); else overview(0);
  if(!animate||reduce||!pts.length){ pins.forEach(g=>g.classList.remove("hid")); r.style.transition="none"; r.style.strokeDashoffset=0; return; }
  pins.forEach(g=>{g.classList.add("hid");g.classList.remove("popnow")});
  r.style.transition="none"; r.style.strokeDashoffset=L; r.getBoundingClientRect();
  const vl=vertexLens(r,pts);
  for(let i=0;i<pts.length;i++){
    if(my!==flyTok) return;
    r.style.transition="stroke-dashoffset 420ms linear"; r.style.strokeDashoffset=L-vl[i];
    await sleep(i===0?120:420); if(my!==flyTok) return;
    const g=pins.find(g=>+g.dataset.i===i); if(g){g.classList.remove("hid");g.classList.add("popnow")}
  }
}
async function tour(){
  S.zoomed=true; S.sel=null; refresh(); const my=++flyTok; await sleep(650); if(my!==flyTok) return;
  const r=document.getElementById("route"), pts=routePts(DAYS.find(x=>x.id===S.day)); if(!r||!pts.length) return;
  const L=r.getTotalLength(), pins=[...document.querySelectorAll(".rp")], vl=vertexLens(r,pts), z=zIn();
  pins.forEach(g=>{g.classList.add("hid");g.classList.remove("popnow")});
  r.style.transition="none"; r.style.strokeDashoffset=L; r.getBoundingClientRect();
  camTo(pts[0].x,pts[0].y,z,700); await sleep(700);
  for(let i=0;i<pts.length;i++){
    if(my!==flyTok) return;
    r.style.transition="stroke-dashoffset 1000ms cubic-bezier(.45,.05,.25,1)"; r.style.strokeDashoffset=L-vl[i];
    camTo(pts[i].x,pts[i].y,z,1000);
    await sleep(i===0?150:850); if(my!==flyTok) return;
    const g=pins.find(g=>+g.dataset.i===i); if(g){g.classList.remove("hid");g.classList.add("popnow")}
    await sleep(350);
  }
  if(my!==flyTok) return; await sleep(400); zoomOut();
}
function zoomTo(x,y){ const was=S.zoomed; S.zoomed=true; refresh(); if(!was){ const p=$("#pano"); if(p&&!reduce){p.classList.remove("zoomed"); p.getBoundingClientRect(); p.classList.add("zoomed")}} flyTok++; camTo(x,y,zIn(),900); }
function zoomOut(){ S.zoomed=false; S.sel=null; const my=++flyTok; const p=$("#pano"), c=p&&p.querySelector(".mcard");
  const shrink=()=>{ if(my!==flyTok) return; c&&c.remove(); if(p) p.classList.remove("zoomed"); overview(650); setTimeout(()=>{ if(!S.zoomed&&S.view==="plan"&&S.pmode==="map") refresh() },700); };
  if(c&&!reduce){ c.classList.add("out"); setTimeout(shrink,180); } else shrink(); }
function flyToPin(k){ const xy=XY[k]; if(!xy) return; zoomTo(xy[0],xy[1]); setTimeout(keepMapClear,650); }
/* make sure the whole map frame (and its card) sits between the top of the screen and the floating tab bar */
function keepMapClear(){ const pn=$("#pano"), tb=document.querySelector(".tabbar nav"); if(!pn||!tb) return;
  const sc=scroller(), vTop=sc===window?0:sc.getBoundingClientRect().top+54, r=pn.getBoundingClientRect(), limit=tb.getBoundingClientRect().top-12;
  let d=0; if(r.bottom>limit) d=r.bottom-limit; if(r.top-d<vTop+8) d=r.top-vTop-8;
  if(Math.abs(d)>2) sc.scrollBy({top:d,behavior:reduce?"auto":"smooth"}); }
function render(anim=true){
  const app=$("#app"); const v=S.view;
  app.innerHTML=`<section class="view" ${anim?"":'style="animation:none"'}>${v==="home"?vHome():v==="plan"?vPlan():vEats()}</section>`;
  if(!anim) app.querySelectorAll(".dayart>img,.heroimg,.count,.next,.st,.it,.ml,.pinpop,.names span,.city,.lede,.city i").forEach(e=>e.style.animation="none");
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));
  if(v==="plan"&&S.pmode==="map") drawRoute(anim);
  // reveal illustrations (and their clouds / lanterns) only once the picture has loaded
  app.querySelectorAll(".dayart>img,.heroimg").forEach(im=>{ const box=im.closest(".dayart,.herobox"), op=im.closest(".opening");
    const ok=()=>{ box.classList.add("ready"); op&&op.classList.add("ready"); };
    if(im.complete&&im.naturalWidth) ok(); else im.addEventListener("load",ok,{once:true}); });
  if(v==="home"&&anim) countUp();
  if(v==="home") yiPeng(anim&&!S.festivalShown);
  if(S.editing){const ta=$("#ta"); if(ta){ta.focus();}}
}
function refresh(){ // data changed elsewhere: re-render without replaying entrance animations, keep any draft
  const ta=$("#ta"), draft=ta?ta.value:null, sx=document.getElementById("pano")?.scrollLeft;
  render(false); if(draft!==null&&$("#ta")) $("#ta").value=draft; const p=document.getElementById("pano"); if(p&&sx!=null) p.scrollLeft=sx;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-pin]");
  if(!t) return;
  const ds=t.dataset;
  if(ds.pmode){ if(S.pmode===ds.pmode) return; S.pmode=ds.pmode; S.zoomed=false; cam=null; S.sel=null; S.open=null; saveUi(); render(); return; }
  if(ds.onmap){ const k=ds.onmap; S.pmode="map"; S.zoomed=false; cam=null; S.sel=null; saveUi(); render(); scrollTop0(); setTimeout(()=>{ S.sel=k; flyToPin(k) },700); return; }
  if(ds.zout){ zoomOut(); return; }
  if(ds.tour){ tour(); return; }
  if(ds.v){ if(S.view===ds.v) return; t.classList.remove("hop"); void t.offsetWidth; t.classList.add("hop"); S.zoomed=false; cam=null; S.view=ds.v; S.editing=null; S.sel=null; saveUi(); render(); scrollTop0(); return; }
  if(ds.goday){ S.day=ds.goday; S.view="plan"; S.open=null; saveUi(); render(); scrollTop0(); return; }
  if(ds.todo){ const id=ds.todo; marks[id]={...(marks[id]||{}),done:!marks[id]?.done}; refresh(); if(marks[id].done){ confetti(document.querySelector(`[data-todo="${id}"]`)); toast("One less thing.") } push(id); return; }
  if(ds.go){ const ti=tripInfo(); if(ti.phase==="during") S.day=DAYS[ti.idx].id; S.view=ds.go; saveUi(); render(); scrollTop0(); return; }
  if(ds.day){ if(S.day===ds.day) return; S.zoomed=false; cam=null; S.day=ds.day; S.open=null; S.editing=null; S.sel=null; saveUi(); render(); return; }
  if(ds.open){ S.open=S.open===ds.open?null:ds.open; S.editing=null; refresh(); return; }
  if(ds.tick){ const id=ds.tick; marks[id]={...(marks[id]||{}),done:!marks[id]?.done}; refresh(); const el=document.querySelector(`[data-st="${id}"]`); if(el&&marks[id].done){el.classList.add("stamp"); const st=DAYS.flatMap(d=>d.stops).find(x=>x.id===id); confetti(el.querySelector(".dot")); const day=DAYS.find(d=>d.stops.some(x=>x.id===id)); if(day.stops.every(x=>marks[x.id]?.done)){ confetti(el,40); toast(`${day.dw} complete. Legends.`) } else toast(cheer(iconFor(st.p,st.k,st.title))) } push(id); return; }
  if(ds.note){ const id=ds.note;
    if(S.editing===id){ const v=($("#ta")?.value||"").trim(); const m=marks[id]||{}; marks[id]={...m,note:v}; S.editing=null; refresh(); push(id); toast(v?"Note saved":"Note removed"); }
    else { S.editing=id; refresh(); } return; }
  if(ds.ptick){ const k=ds.ptick, was=isDone(k), id="p-"+k;
    if(was) DAYS.forEach(d=>d.stops.forEach(s=>{ if(s.p===k&&marks[s.id]?.done){marks[s.id]={...marks[s.id],done:false};push(s.id)} }));
    marks[id]={...(marks[id]||{}),done:!was}; refresh(); if(!was){ confetti(document.querySelector(`[data-ptick="${k}"]`)); toast(cheer(iconFor(k,"eat"))) } push(id); return; }
  if(ds.pin){ const k=ds.pin; if(S.sel===k){ zoomOut(); return; } S.sel=k; if(t.classList.contains("ml")){ const pn=$("#pano"); if(pn) { const sc=scroller(), base=sc===window?scrollY:sc.scrollTop, off=sc===window?0:sc.getBoundingClientRect().top; sc.scrollTo({top:Math.max(0,pn.getBoundingClientRect().top-off+base-(sc===window?72:60)),behavior:reduce?"auto":"smooth"}) } } flyToPin(k); return; }
  if(ds.replay){ S.zoomed=false; S.sel=null; render(false); drawRoute(true); return; }
  if(ds.eats){ S.eats=ds.eats; render(); return; }
  if(ds.copy){ const v=ds.copy; try{navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>toast(v))}catch(_){toast(v)} return; }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-pin]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))} });
/* swipe between days on Plan */
let sx0=null,sy0=null;
document.addEventListener("touchstart",e=>{ if(S.view!=="plan"||e.target.closest("textarea,#pano"))return; sx0=e.touches[0].clientX; sy0=e.touches[0].clientY },{passive:true});
document.addEventListener("touchend",e=>{ if(sx0==null)return; const dx=e.changedTouches[0].clientX-sx0, dy=e.changedTouches[0].clientY-sy0; sx0=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){ const i=DAYS.findIndex(d=>d.id===S.day)+(dx<0?1:-1); if(DAYS[i]){S.day=DAYS[i].id;S.open=null;saveUi();render()} } },{passive:true});
render();
</script>
