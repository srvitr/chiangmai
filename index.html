/* Layout: one phone-width column (max 430px), a single view at a time, bottom tab bar. Minimal: white ground, hairlines, palette used sparingly. */
:root{

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}

h1.dh{height:auto;margin-top:6px;white-space:nowrap;font-size:min(34px,8.2vw)}

.herobox{position:relative;margin:18px calc(-1 * max(24px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(24px,env(safe-area-inset-left,0px)));background:transparent;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}

/* day tabs */
.dayart{position:relative;margin:10px calc(-1 * max(24px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(24px,env(safe-area-inset-left,0px)));overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}

.yipeng{position:absolute;left:calc(-1 * max(24px,env(safe-area-inset-left,0px)));top:-28px;width:calc(100% + max(24px,env(safe-area-inset-left,0px)) + max(24px,env(safe-area-inset-right,0px)));height:calc(100% + 28px);display:block;pointer-events:none;z-index:3}
.dusk{position:absolute;left:calc(-1 * max(24px,env(safe-area-inset-left,0px)));right:calc(-1 * max(24px,env(safe-area-inset-right,0px)));top:-28px;bottom:0;z-index:2;pointer-events:none;opacity:0;
  background:radial-gradient(120% 70% at 50% 100%,rgba(201,120,60,.55),rgba(201,120,60,0) 60%),linear-gradient(180deg,#2B1A17 0%,#0A3442 45%,#1D4B57 75%,rgba(227,234,237,0) 100%);transition:opacity 1.4s ease}
.opening.night .dusk{opacity:.94}
.opening .hhead,.opening .herobox{position:relative;z-index:1}
.opening.night .hhead{z-index:4}
.opening .hhead .lab,.opening .names,.opening .city{transition:color 1.2s ease}
.opening.night .hhead .lab{color:#B5A194}
.opening.night .city{color:#F6F1E3}
.opening.night .names{color:#FFD58A}
.opening.night .names span:nth-child(2){color:#C9973A}
.opening.night .count{color:#F6F1E3} .opening.night .count span{color:#DDD0C0}
.opening .heroimg{transition:filter 1.4s ease}
.opening.night .heroimg{filter:brightness(.62) saturate(.9) sepia(.18)}
.opening.night .count{z-index:4}
.skip{position:absolute;right:0;top:-16px;z-index:5;font-size:12px;color:#DDD0C0;padding:8px 2px;opacity:0;transition:opacity .4s}
.opening.night .skip{opacity:1}

.dayart .cloud{position:absolute;pointer-events:none;height:auto;filter:drop-shadow(0 6px 10px rgba(43,26,23,.10));animation:drift linear infinite}
.dayart .cloud.c1{width:22%;top:6%;animation-duration:70s;animation-delay:-18s}
.dayart .cloud.c2{width:15%;top:22%;opacity:.9;animation-duration:95s;animation-delay:-60s}
.dayart .cloud.c3{width:11%;top:2%;opacity:.8;animation-duration:120s;animation-delay:-35s}
@keyframes drift{from{left:-25%}to{left:105%}}

.dayart .cloud,.yipeng{transition:opacity .8s ease}
.dayart:not(.ready) .cloud,.opening:not(.ready) .yipeng{opacity:0!important}
.dayart:not(.ready)>img,.herobox:not(.ready) .heroimg{opacity:0}
.dayart>img,.heroimg{transition:opacity .5s ease}

/* no text/image selection or grey tap flash on things you tap or drag */
html{-webkit-tap-highlight-color:transparent}

img{-webkit-user-drag:none}

/* selected / pressed stop in the day plan: a soft sage-tinted card */
.st{margin-inline:-12px;padding-inline:12px;transition:background-color .25s ease,box-shadow .25s ease}
.st.open{background:#F4EBE3;box-shadow:inset 3px 0 0 #C9973A;border-top-color:transparent;border-radius:4px 14px 14px 4px}
.st:has(.hit:active):not(.open){border-radius:14px}
.st.open+.st{border-top-color:transparent}
.st:has(.hit:active):not(.open){background:rgba(255,255,255,.45)}

/* no focus box on map pins / taps; keyboard users still get a ring via :focus-visible on real buttons */
.pin,.pin:focus,.pin:focus-visible,g[data-pin]:focus,g[data-pin]:focus-visible{outline:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}

.pmode i.r{transform:translateX(100%)}

.dayart .cloud.c2,.dayart .cloud.c3{display:none}

.ph{position:relative;cursor:pointer}
.ph .en{padding-right:30px}

let thVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^th/i.test(v.lang));
  thVoice=vs.find(v=>/kanya|narisa|premwadee|female|หญิง/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs[0]||null; }catch(_){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.addEventListener?.("voiceschanged",pickVoice); }
function sayIt(text,btn){
  const S=window.speechSynthesis;
  if(!S||!window.SpeechSynthesisUtterance){ toast("This browser can't read aloud"); return; }
  document.querySelectorAll(".say.talk").forEach(b=>b.classList.remove("talk"));
  if(!thVoice) pickVoice();
  const u=new SpeechSynthesisUtterance(text); u.lang="th-TH"; if(thVoice) u.voice=thVoice;
  u.pitch=1.85; u.rate=.86; u.volume=1;   // high, slow and dramatic: the ตัวแม่ delivery
  window._utt=u;                         // keep a reference: iOS/Chrome can drop utterances that get garbage-collected
  let started=false;
  const done=()=>btn.classList.remove("talk");
  u.onstart=()=>{ started=true; btn.classList.add("talk"); };
  u.onend=done; u.onerror=e=>{ done(); if(e&&e.error&&e.error!=="interrupted"&&e.error!=="canceled") toast("Couldn't play the voice ("+e.error+")"); };
  btn.classList.add("talk");
  // Safari drops speak() called right after cancel(), so only cancel when something is actually playing
  if(S.speaking||S.pending){ S.cancel(); setTimeout(()=>S.speak(u),120); } else { S.resume&&S.resume(); S.speak(u); }
  setTimeout(()=>{ if(!started){ done(); toast(thVoice?"No sound? Turn off silent mode and raise the volume":"No Thai voice on this device"); } },2500);
  setTimeout(done,8000);
}

  const atEnd=(dx>0&&i===0)||(dx<0&&i===DAYS.length-1); if(!atEnd) return;
  sec.style.transition="none"; sec.style.transform=`translateX(${Math.sign(dx)*rband(Math.abs(dx))}px)`; sec.dataset.band="1"; },{passive:true});
function bandBack(){ const sec=$("#app .pbody"); if(!sec||!sec.dataset.band) return; delete sec.dataset.band;
  sec.style.transition="transform .45s cubic-bezier(.2,1.4,.4,1)"; sec.style.transform=""; setTimeout(()=>{ sec.style.transition=""; },460); }
document.addEventListener("touchend",e=>{ bandBack(); if(sx0==null)return; const dx=e.changedTouches[0].clientX-sx0, dy=e.changedTouches[0].clientY-sy0; sx0=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){ const i=DAYS.findIndex(d=>d.id===S.day)+(dx<0?1:-1); if(DAYS[i]){const prev=S.day;S.day=DAYS[i].id;S.open=null;S.zoomed=false;cam=null;S.sel=null;saveUi();dayGo(prev)} } },{passive:true});

/* ---------- native feel: transitions, title bar, sheets, swipe back, haptics, launch ---------- */
function vt(fn,dir){ if(!document.startViewTransition||reduce){ fn(); return; }
  const h=document.documentElement; h.dataset.vt=dir||"fade";
  try{ const t=document.startViewTransition(fn); t.finished.finally(()=>{ if(h.dataset.vt===(dir||"fade")) delete h.dataset.vt; }); }catch(_){ delete h.dataset.vt; fn(); } }
/* changing day: the header and date tabs never move; the old itinerary slides out, the new one slides in (plain animations, no view transition) */
function dayGo(prev){ haptic(); const fwd=DAYS.findIndex(d=>d.id===S.day)>DAYS.findIndex(d=>d.id===prev), dir=fwd?1:-1;
  const sc=scroller(), keep=sc===window?scrollY:sc.scrollTop, old=$("#app .pbody");
  let ghost=null; if(old&&!reduce&&old.animate){ ghost=old.cloneNode(true); ghost.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id")); }
  render(false); sc.scrollTo({top:keep});
  const pb=$("#app .pbody"); if(!pb||!ghost) return;
  const host=pb.parentElement; if(getComputedStyle(host).position==="static") host.style.position="relative";
  ghost.setAttribute("aria-hidden","true"); ghost.style.cssText=`position:absolute;left:${pb.offsetLeft}px;top:${pb.offsetTop}px;width:${pb.offsetWidth}px;margin:0;pointer-events:none`;
  host.insertBefore(ghost,pb);
  const ease="cubic-bezier(.2,.8,.2,1)";
  ghost.animate([{transform:"none",opacity:1},{transform:`translateX(${-dir*22}%)`,opacity:0}],{duration:260,easing:ease,fill:"forwards"}).onfinish=()=>ghost.remove();
  pb.animate([{transform:`translateX(${dir*28}%)`,opacity:0},{transform:"none",opacity:1}],{duration:320,easing:ease}); }
/* haptics: Android vibrate; iOS 18 ticks when a hidden switch is toggled */
let HAP=null;
function haptic(){ try{ if(navigator.vibrate){ navigator.vibrate(8); return; }
  if(!HAP){ HAP=document.createElement("label"); HAP.setAttribute("aria-hidden","true"); HAP.style.cssText="position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
    const i=document.createElement("input"); i.type="checkbox"; i.setAttribute("switch",""); i.tabIndex=-1; HAP.appendChild(i); document.body.appendChild(HAP); }
  HAP.click(); }catch(_){} }
/* compact title bar */
function navTitle(){ if(S.view==="home") return "Mo & Pob"; if(S.view==="eats") return "More to eat"; const d=DAYS.find(x=>x.id===S.day); return d?`${d.dw} ${d.dn} · ${d.title}`:""; }
function updNav(){ const nb=$("#navbar"); if(!nb) return; if(inDevice()){ nb.classList.remove("on"); document.documentElement.style.removeProperty("--nav"); return; }
  const h=document.querySelector("#app h1,#app .hhead"), top=parseFloat(getComputedStyle(nb).paddingTop)||0;
  const on=!!h&&h.getBoundingClientRect().bottom<top+44; $("#navtitle").textContent=navTitle();
  if(on!==nb.classList.contains("on")){ nb.classList.toggle("on",on); document.documentElement.style.setProperty("--nav",on?"44px":"0px"); } }
let navRAF=0; addEventListener("scroll",()=>{ if(!navRAF) navRAF=requestAnimationFrame(()=>{ navRAF=0; updNav(); }); },{passive:true});
/* back stack + swipe from the left edge */
const NAV=[];
function navPush(){ NAV.push({view:S.view,day:S.day,y:scroller()===window?scrollY:scroller().scrollTop}); if(NAV.length>20) NAV.shift(); }
function goBack(){ if(document.querySelector(".sheet.on")){ closeSheet(); haptic(); return; }
  const p=NAV.pop(); if(!p) return; haptic();
  vt(()=>{ S.view=p.view; S.day=p.day; S.open=null; S.sel=null; saveUi(); render(false); scroller().scrollTo({top:p.y}); },"back"); }
let ex0=null, ey0=null;
document.addEventListener("touchstart",e=>{ const t=e.touches[0]; ex0=t.clientX<24?t.clientX:null; ey0=t.clientY; },{passive:true,capture:true});
document.addEventListener("touchend",e=>{ if(ex0==null) return; const t=e.changedTouches[0], dx=t.clientX-ex0, dy=t.clientY-ey0; ex0=null; if(dx>60&&Math.abs(dy)<dx*0.8) goBack(); },{passive:true,capture:true});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.querySelector(".sheet.on")) closeSheet(); });
/* bottom sheets: drag the handle (or the top of the sheet) down to close */
/* iOS-style rubber band: resistance grows the further you pull, capped around 70px */
const rband=(x,max=70)=>max*(1-1/(x/(max*1.6)+1));
function openSheet(html,label){ closeSheet(true); haptic();
  const bg=document.createElement("div"); bg.className="sh-bg"; bg.addEventListener("click",()=>closeSheet());
  const sh=document.createElement("div"); sh.className="sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true"); sh.setAttribute("aria-label",label||"Details");
  sh.innerHTML=`<div class="grip"><i></i></div><div class="sbody">${html}</div>`;
  document.body.append(bg,sh); requestAnimationFrame(()=>requestAnimationFrame(()=>{ bg.classList.add("on"); sh.classList.add("on"); }));
  const body=sh.querySelector(".sbody"); let y0=null,t0=0,dy=0;
  sh.addEventListener("touchstart",e=>{ if(body.scrollTop>0&&!e.target.closest(".grip")) { y0=null; return; } y0=e.touches[0].clientY; t0=Date.now(); dy=0; sh.style.transition="none"; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(y0==null) return; const raw=e.touches[0].clientY-y0; dy=Math.max(0,raw);
    if(dy>0){ sh.style.transform=`translateY(${dy}px)`; bg.style.opacity=String(Math.max(0,1-dy/400)); if(e.cancelable) e.preventDefault(); }
    else if(raw<0&&body.scrollHeight<=body.clientHeight+1){ sh.style.transform=`translateY(${-rband(-raw,40)}px)`; if(e.cancelable) e.preventDefault(); } },{passive:false});
  sh.addEventListener("touchend",()=>{ if(y0==null) return; y0=null; sh.style.transition=""; bg.style.opacity="";
    const v=dy/Math.max(1,Date.now()-t0); if(dy>110||(dy>30&&v>0.6)){ closeSheet(); } else { sh.style.transform=""; } },{passive:true});
  sh.tabIndex=-1; sh.style.outline="none"; setTimeout(()=>sh.focus({preventScroll:true}),350); }
function closeSheet(now){ document.querySelectorAll(".sheet,.sh-bg").forEach(e=>{ if(now){ e.remove(); return; } e.classList.remove("on"); if(e.classList.contains("sheet")) e.style.transform=""; setTimeout(()=>e.remove(),340); });
  if(!now&&S.fsel&&S.view==="plan"){ S.fsel=null; refresh(); } }
function stopSheet(id){ const d=DAYS.find(x=>x.stops.some(s=>s.id===id)); if(!d) return; const s=d.stops.find(x=>x.id===id), p=P[s.p]||{}, LM=lateMap(d), T=LM[s.id]?LM[s.id].t:s.t, os=openState(s.p);
  const isToday=nowId(d)!=null;
  const tags=s.k==="fly"?"":((isToday&&geoTag(s,T))||liveTag(s.d,isToday,false,LM[s.id]?tmin(T)-tmin(s.t):0))+wxTag(s,d,T);
  const html=`<div class="slab">${d.dw} ${d.dn} · ${T}${LM[s.id]?` (was ${s.t})`:""}</div><h2>${esc(s.title)}${s.bk?' <span class="bkd-chip">Booked</span>':""}</h2>${tags}
    ${s.k==="fly"?flightCard(s.id):""}<p class="sdesc">${esc(s.d)}</p>
    <div class="facts">${os?`<span>${esc(os.txt)}</span>`:p.h?`<span>${esc(p.h)}</span>`:""}${p.book?`<span>Book · ${esc(p.book)}</span>`:""}${p.uv?`<span>Check hours on Maps</span>`:""}${s.alt?`<span>Or ${esc(P[s.alt].n)}</span>`:""}</div>
    <div class="sacts">${p.q&&s.p!=="cnx"?`<button class="grab" data-grab="${s.p}">Grab here</button>`:""}${p.q?`<a href="${mapsUrl(s.p)}" target="_blank" rel="noopener">Directions</a>`:""}</div>`;
  openSheet(html,s.title); }
function placeSheet(k){ const p=P[k]; if(!p) return; const os=openState(k), g=geoNow(), dk=g&&LL[k]?km([g.la,g.lo],LL[k]):null;
  const html=`<div class="slab">${esc(p.c)}</div><h2>${esc(p.n)}</h2>
    <div class="facts">${os?`<span>${esc(os.txt)}</span>`:""}${p.h?`<span>${esc(p.h)}</span>`:""}${dk!=null?`<span>${kmTxt(dk)} away</span>`:""}${p.r?`<span>★ ${p.r}</span>`:""}${p.uv?`<span>Check hours on Maps</span>`:""}</div>
    <div class="sacts"><button class="grab" data-grab="${k}">Grab here</button><a href="${mapsUrl(k)}" target="_blank" rel="noopener">Google Maps</a></div>`;
  openSheet(html,p.n); }

/* pull to refresh: weather, location, open-now, and a newer version of the app */
let pr0=null, prD=0, prBusy=false, prReload=false;
const scTop=()=>scroller()===window?scrollY:scroller().scrollTop;
document.addEventListener("touchstart",e=>{ if(prBusy||document.querySelector(".sheet")||scTop()>2||e.touches[0].clientX<24){ pr0=null; return; } pr0=e.touches[0].clientY; prD=0; },{passive:true});
document.addEventListener("touchmove",e=>{ if(pr0==null) return; prD=e.touches[0].clientY-pr0; const el=$("#ptr"); if(!el) return;
  if(prD<=0||scTop()>2){ el.style.opacity="0"; return; } const d=rband(prD,110), k=Math.min(1,prD/90);
  el.style.transition="none"; el.style.opacity=String(k); el.style.transform=`translateY(${d-30}px) scale(${.6+.4*k})`; el.querySelector("svg").style.transform=`rotate(${prD*2.4}deg)`; },{passive:true});
document.addEventListener("touchend",()=>{ if(pr0==null) return; pr0=null; const el=$("#ptr"); if(!el) return;
  if(prD>90&&!prBusy){ prBusy=true; haptic(); el.style.transition="transform .25s ease"; el.style.transform="translateY(46px) scale(1)"; el.querySelector("svg").style.transform=""; el.classList.add("spin"); pullRefresh(); }
  else { el.style.transition="opacity .2s, transform .25s"; el.style.opacity="0"; el.style.transform="translateY(-40px) scale(.6)"; } prD=0; },{passive:true});
async function pullRefresh(){ const el=$("#ptr"), t0=Date.now();
  try{ localStorage.removeItem("mp-wx"); }catch(_){} wxLoad(true);
  if(geoWatch!=null&&navigator.geolocation) navigator.geolocation.getCurrentPosition(pos=>{ GEO={la:pos.coords.latitude,lo:pos.coords.longitude}; refresh(); },()=>{},{maximumAge:0,timeout:8000});
  let updated=false;
  try{ const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(r){ prReload=true; await r.update(); updated=!!(r.installing||r.waiting); } }catch(_){}
  await sleep(Math.max(0,700-(Date.now()-t0)));
  if(updated){ toast("Getting the latest version…"); setTimeout(()=>location.reload(),1200); return; }
  prReload=false; refresh(); toast("Up to date");
  el.classList.remove("spin"); el.style.transition="opacity .2s, transform .25s"; el.style.opacity="0"; el.style.transform="translateY(-40px) scale(.6)"; prBusy=false; }
if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(prReload) location.reload(); });
/* long-press: Grab, Directions, Copy name, Share */
let lpT=null, lpEl=null, lpX=0, lpY=0, lpFired=false;
const IC={grab:'<svg viewBox="0 0 24 24"><path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16"/><path d="M4 16h16v3H4z"/><circle cx="8" cy="19" r="1.4"/><circle cx="16" cy="19" r="1.4"/></svg>',
  dir:'<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>'};
function lpMenu(el){ let k, head, sub;
  if(el.dataset.open){ const d=DAYS.find(x=>x.stops.some(s=>s.id===el.dataset.open)); const st=d&&d.stops.find(s=>s.id===el.dataset.open); if(!st) return; k=st.p; head=st.title; sub=`${d.dw} ${d.dn} · ${st.t}`; }
  else { k=el.dataset.place; head=P[k]?.n; sub=P[k]?.c; }
  const pl=P[k]; if(!pl) return;
  const html=`<div class="cm-head"><b>${esc(head)}</b><small>${esc(sub||"")}</small></div><div class="cmenu">
    ${pl.q&&k!=="cnx"?`<button class="cg" data-grab="${k}">Grab here ${IC.grab}</button>`:""}
    ${pl.q?`<a href="${mapsUrl(k)}" target="_blank" rel="noopener">Directions ${IC.dir}</a>`:""}
    <button data-copy="${esc(pl.n)}">Copy name ${IC.copy}</button>
    <button data-share="${k}">Share ${IC.share}</button></div>`;
  openSheet(html,head); }
document.addEventListener("touchstart",e=>{ const el=e.target.closest("[data-open],[data-place]"); if(!el||e.touches.length>1) return; lpEl=el; lpFired=false; lpX=e.touches[0].clientX; lpY=e.touches[0].clientY;
  clearTimeout(lpT); lpT=setTimeout(()=>{ lpFired=true; lpAt=Date.now(); el.classList.remove("pressing"); lpEl=null; lpMenu(el); },480); setTimeout(()=>{ if(lpEl===el&&!lpFired) el.classList.add("pressing"); },120); },{passive:true});
const lpCancel=()=>{ clearTimeout(lpT); lpT=null; if(lpEl) lpEl.classList.remove("pressing"); lpEl=null; };
document.addEventListener("touchmove",e=>{ if(!lpEl) return; if(Math.hypot(e.touches[0].clientX-lpX,e.touches[0].clientY-lpY)>10) lpCancel(); },{passive:true});
let lpAt=0;
document.addEventListener("touchend",e=>{ if(lpFired&&lpEl===null&&Date.now()-lpAt<1500&&e.cancelable) e.preventDefault(); lpCancel(); },{passive:false}); document.addEventListener("touchcancel",lpCancel,{passive:true});
document.addEventListener("click",e=>{ if(lpFired&&Date.now()-lpAt<1000){ e.stopPropagation(); e.preventDefault(); lpFired=false; } },true);
document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-open],[data-place]")) e.preventDefault(); });
/* launch overlay fades into the app */
(function(){ const b=document.getElementById("boot"); if(!b) return; if(getComputedStyle(b).display==="none"){ b.remove(); return; }
  setTimeout(()=>{ b.classList.add("out"); setTimeout(()=>b.remove(),500); },450); })();
render();
setInterval(()=>{ if(S.view==="plan"&&S.pmode!=="map"&&!S.open&&tripInfo().phase==="during") refresh(); },60000);
</script>
